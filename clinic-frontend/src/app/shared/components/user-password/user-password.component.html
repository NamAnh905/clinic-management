<div class="p-4 md:p-5">
    <div class="border-bottom-1 surface-border mb-4 pb-3">
        <h2 class="text-xl font-bold m-0 text-900">Đổi mật khẩu</h2>
        <span class="text-500 text-sm">Để bảo mật tài khoản, vui lòng không chia sẻ mật khẩu cho người khác</span>
    </div>

    <div class="grid">
        <div class="col-12 md:col-8 lg:col-6">
            <form [formGroup]="passwordForm">
                <div class="field mb-3">
                    <label class="font-bold block mb-2 text-900">Mật khẩu hiện tại</label>
                    <input pInputText type="password" formControlName="currentPassword" placeholder="Nhập mật khẩu cũ" class="w-full" />
                    <small *ngIf="passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched" class="p-error text-red-500 block mt-1">
                        Vui lòng nhập mật khẩu hiện tại.
                    </small>
                </div>

                <div class="field mb-3">
                    <label class="font-bold block mb-2 text-900">Mật khẩu mới</label>
                    <input pInputText type="password" formControlName="newPassword" placeholder="Tối thiểu 6 ký tự" class="w-full" />
                    <small *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']" class="p-error text-red-500 block mt-1">
                        Mật khẩu phải có ít nhất 6 ký tự.
                    </small>
                </div>

                <div class="field mb-4">
                    <label class="font-bold block mb-2 text-900">Xác nhận mật khẩu mới</label>
                    <input pInputText type="password" formControlName="confirmPassword" placeholder="Nhập lại mật khẩu mới" class="w-full" />
                    <small *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched" class="p-error text-red-500 block mt-1">
                        Mật khẩu xác nhận không khớp.
                    </small>
                </div>

                <button pButton label="Lưu thay đổi" icon="pi pi-check" (click)="savePassword()" [disabled]="passwordForm.invalid"></button>
            </form>
        </div>
    </div>
</div>
