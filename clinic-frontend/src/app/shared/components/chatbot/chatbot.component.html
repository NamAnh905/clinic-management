<button class="chat-launcher" (click)="toggleChat()" *ngIf="!isOpen"
        [class.shaking]="unreadCount > 0">

  <i class="pi pi-comments" style="font-size: 1.5rem"></i>

  <span class="notification-badge" *ngIf="unreadCount > 0">
    {{ unreadCount }}
  </span>
</button>

<div class="chat-container" *ngIf="isOpen">
  <div class="chat-header">
    <div class="header-info">
      <div class="avatar">AI</div>
      <div>
        <h4 class="bot-name">Trợ lý 28Care</h4>
        <span class="status-dot"></span> <span class="status-text">Đang hoạt động</span>
      </div>
    </div>
    <button class="close-btn" (click)="toggleChat()">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div class="chat-body" #scrollContainer>
    <div *ngFor="let msg of messages"
         class="message-wrapper"
         [ngClass]="{'user': msg.sender === 'user', 'bot': msg.sender === 'bot'}">
      <div class="message-bubble">{{ msg.text }}</div>
    </div>

    <div class="message-wrapper bot" *ngIf="isLoading">
      <div class="message-bubble loading">
        <span>.</span><span>.</span><span>.</span>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <input type="text"
           [(ngModel)]="userQuestion"
           (keyup.enter)="sendMessage()"
           placeholder="Nhập câu hỏi..."
           [disabled]="isLoading">
    <button class="send-btn" (click)="sendMessage()" [disabled]="!userQuestion.trim()">
      <i class="pi pi-send"></i>
    </button>
  </div>
</div>
