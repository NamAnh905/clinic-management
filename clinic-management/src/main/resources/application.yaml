server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: clinic-management
  config:
    import: optional:classpath:application-secret.yaml
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 3600
  refreshable-duration: 86400

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

cloud:
  name: ${CLOUD_NAME}
  api:
    key: ${API_KEY}
    secret: ${API_SECRET}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL}

langchain4j:
  gemini:
    model-name: ${GEMINI_MODEL_NAME}
    embedding-model: ${GEMINI_EMBEDDING_MODEL}
    temperature: 0.7
  qdrant:
    host: ${QDRANT_HOST}
    port: ${QDRANT_PORT}
    collection-name: "clinic_knowledge_v2"