<p-toast></p-toast>
<div class="medical-background">
  <div class="floating-shape shape-1"></div>
</div>

<div class="login-container">
  <div class="wellness-card">
    <div class="organic-border"></div>
    <div class="mindful-header">
      <h1>28Care</h1>
      <p>Khôi phục mật khẩu</p>
    </div>

    <form [formGroup]="forgotForm" class="harmony-form">
      <div *ngIf="step === 1">
        <div class="organic-field">
          <input type="email" formControlName="email" id="email" placeholder=" ">
          <label for="email">Email tài khoản</label>
        </div>
        <button type="button" class="harmony-button" (click)="sendOtp()" [disabled]="forgotForm.get('email')?.invalid || isLoading">
          Gửi mã OTP
        </button>
      </div>

      <div *ngIf="step === 2">
        <div class="organic-field">
          <input type="text" formControlName="otp" id="otp" placeholder=" ">
          <label for="otp">Nhập 6 số OTP</label>
        </div>
        <button type="button" class="harmony-button" (click)="verifyOtp()" [disabled]="forgotForm.get('otp')?.invalid">
          Xác nhận mã
        </button>
      </div>

      <div *ngIf="step === 3">
        <div class="organic-field">
          <input type="password" formControlName="newPassword" id="newPass" placeholder=" ">
          <label for="newPass">Mật khẩu mới</label>
        </div>
        <div class="organic-field">
          <input type="password" formControlName="confirmPassword" id="confPass" placeholder=" ">
          <label for="confPass">Xác nhận mật khẩu</label>
          <span class="gentle-error" *ngIf="forgotForm.hasError('mismatch')">Mật khẩu không khớp</span>
        </div>
        <button type="button" class="harmony-button" (click)="handleResetPassword()" [disabled]="forgotForm.invalid || isLoading">
          Cập nhật mật khẩu
        </button>
      </div>
    </form>

    <div class="nurture-signup">
      <a routerLink="/login" class="growth-link">Quay lại đăng nhập</a>
    </div>
  </div>
</div>
